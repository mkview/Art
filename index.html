<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Portfolio</title>
  <style>
    :root { color-scheme:dark; --bg:#121212; --panel:#1e1e1e; --text:#e0e0e0; --accent:#007bff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 20px; background:var(--panel); border-bottom:1px solid #333; }
    .logo-container { display:flex; align-items:center; gap:10px; color:inherit; text-decoration:none; }
    .logo-img { width:35px; height:35px; object-fit:cover; border-radius:4px; background:#333; }
    .brand-name { color:#fff; font-weight:700; }
    nav { display:flex; gap:8px; }
    .nav-link,.search-btn { padding:9px 14px; color:#fff; background:#333; border:0; border-radius:4px; cursor:pointer; }
    .nav-link:hover,.search-btn:hover { background:var(--accent); }
    main { width:min(1200px,100%); margin:0 auto; padding:24px; flex:1; }
    .content-section { display:none; }
    .content-section.active { display:block; }
    .galleries-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; }
    .gallery-card { overflow:hidden; color:inherit; text-decoration:none; background:var(--panel); border:1px solid #333; border-radius:6px; }
    .card-img-wrapper { height:200px; background:#151515; }
    .card-img { width:100%; height:100%; object-fit:cover; }
    .card-info { padding:12px; }
    .card-info h3 { margin:0; color:#fff; }
    .search-container { margin-top:28px; }
    .search-form { display:flex; gap:8px; max-width:600px; margin:auto; }
    .search-input { min-width:0; flex:1; padding:11px; color:var(--text); background:var(--panel); border:1px solid #444; border-radius:4px; }
    .info-box { padding:16px; background:var(--panel); border:1px solid #333; border-radius:6px; }
    .info-box h2:first-child { margin-top:0; }
    .info-box p:last-child { margin-bottom:0; }
    #readme { max-width:900px; margin:32px auto; padding:24px; line-height:1.6; }
    #readme pre { white-space:pre-wrap; }
    @media(max-width:650px) { header { align-items:flex-start; flex-direction:column; } nav { flex-wrap:wrap; } main { padding:16px; } }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
</head>
<body>
  <div id="artistApp">
    <header>
      <div class="logo-container"><img class="logo-img" alt="Logo" onerror="this.style.display='none'"><span class="brand-name">Artist Portfolio</span></div>
      <nav>
        <button class="nav-link" onclick="showSection('home-section')">Home</button>
        <button class="nav-link" onclick="scrollToSearch()">Search</button>
        <button class="nav-link" onclick="showSection('about-section')">About</button>
        <button class="nav-link" onclick="showSection('contact-section')">Contact</button>
      </nav>
    </header>
    <main>
      <section id="home-section" class="content-section active">
        <div id="galleriesGrid" class="galleries-grid"></div>
        <div class="search-container" id="searchContainer">
          <form class="search-form" onsubmit="handleSearch(event)">
            <input id="searchInput" class="search-input" type="search" placeholder="Search artwork...">
            <button class="search-btn" type="submit">Search</button>
          </form>
        </div>
      </section>
      <section id="about-section" class="content-section"><h1>About</h1><div id="aboutContent" class="info-box"><p>Artist information can be added here.</p></div></section>
      <section id="contact-section" class="content-section"><h1>Contact</h1><div id="contactContent" class="info-box"><p>Contact information can be added here.</p></div></section>
    </main>
  </div>
  <script>
    const DEFAULT_CONFIG = { brandName:'Artist Portfolio', searchPlaceholder:'Search artwork...' };
    let siteConfig;

    function showReadme() {
      document.getElementById('artistApp').hidden = true;
      document.title = 'Art — README';
      const readme = document.createElement('article');
      readme.id = 'readme';
      readme.setAttribute('aria-live', 'polite');
      readme.textContent = 'Loading README.md…';
      document.body.appendChild(readme);
      fetch('README.md').then(response => {
        if (!response.ok) throw new Error(`Could not load README.md (${response.status})`);
        return response.text();
      }).then(markdown => {
        if (window.marked && window.DOMPurify) {
          readme.innerHTML = DOMPurify.sanitize(marked.parse(markdown));
        } else {
          const plainText = document.createElement('pre');
          plainText.style.whiteSpace = 'pre-wrap';
          plainText.style.font = 'inherit';
          plainText.textContent = markdown;
          readme.replaceChildren(plainText);
        }
      }).catch(error => {
        readme.textContent = `${error.message}\n\nView README.md on GitHub: https://github.com/mkview/Art/blob/main/README.md`;
      });
    }
    function getConfigUrl() {
      const requested = new URLSearchParams(location.search).get('config');
      return requested ? new URL(requested, location.href).href : null;
    }
    function resolveDataUrl(value, field, configUrl) {
      if (typeof value !== 'string' || !value.trim()) {
        throw new Error(`The supplied config must specify ${field}.`);
      }
      return new URL(value, configUrl).href;
    }
    function makeViewerUrl(pageName, params = {}) {
      const url = new URL(pageName, location.href);
      url.search = '';
      url.searchParams.set('config', siteConfig.configUrl);
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== '') url.searchParams.set(key, String(value));
      });
      return url.href;
    }
    async function loadSiteConfig() {
      const configUrl = getConfigUrl();
      if (!configUrl) throw new Error('Provide the artist config URL using ?config=...');
      const response = await fetch(configUrl);
      if (!response.ok) throw new Error(`Could not load configuration from ${configUrl}`);
      const data = await response.json();
      return {
        configUrl,
        brandName: data.brandName || data.brand_name || DEFAULT_CONFIG.brandName,
        logoUrl: resolveDataUrl(data.logoUrl || data.logo_url, 'logoUrl', configUrl),
        galleriesUrl: resolveDataUrl(data.galleriesUrl || data.galleries_url, 'galleriesUrl', configUrl),
        imagesUrl: resolveDataUrl(data.imagesUrl || data.images_url, 'imagesUrl', configUrl),
        searchPlaceholder: data.searchPlaceholder || data.search_placeholder || DEFAULT_CONFIG.searchPlaceholder,
        about: data.about || data.aboutContent || data.about_content,
        contact: data.contact,
        contactEmail: data.contactEmail || data.contact_email
      };
    }
    function appendTextParagraph(container, value) {
      if (typeof value !== 'string' || !value.trim()) return;
      const paragraph = document.createElement('p');
      paragraph.textContent = value;
      container.appendChild(paragraph);
    }
    function renderAbout(about) {
      const container = document.getElementById('aboutContent');
      container.replaceChildren();
      const sections = Array.isArray(about) ? about : [about];
      sections.forEach(section => {
        if (typeof section === 'string') {
          appendTextParagraph(container, section);
          return;
        }
        if (!section || typeof section !== 'object') return;
        if (typeof section.title === 'string' && section.title.trim()) {
          const title = document.createElement('h2');
          title.textContent = section.title;
          container.appendChild(title);
        }
        const paragraphs = Array.isArray(section.paragraphs) ? section.paragraphs :
          (section.paragraphs ? [section.paragraphs] : [section.content || section.description]);
        paragraphs.forEach(paragraph => appendTextParagraph(container, paragraph));
      });
      if (!container.childElementCount) appendTextParagraph(container, 'Artist information can be added here.');
    }
    function renderContact(contact, contactEmail) {
      const container = document.getElementById('contactContent');
      container.replaceChildren();
      if (typeof contact === 'string') appendTextParagraph(container, contact);
      else if (contact && typeof contact === 'object') {
        appendTextParagraph(container, contact.message || contact.description);
        appendTextParagraph(container, contact.phone);
        contactEmail = contactEmail || contact.email;
      }
      if (typeof contactEmail === 'string' && contactEmail.trim()) {
        const paragraph = document.createElement('p');
        const link = document.createElement('a');
        link.href = `mailto:${contactEmail.trim()}`;
        link.textContent = contactEmail.trim();
        paragraph.appendChild(link);
        container.appendChild(paragraph);
      }
      if (!container.childElementCount) appendTextParagraph(container, 'Contact information can be added here.');
    }
    async function loadHub() {
      const grid = document.getElementById('galleriesGrid');
      try {
        siteConfig = await loadSiteConfig();
        document.title = siteConfig.brandName;
        document.querySelector('.brand-name').textContent = siteConfig.brandName;
        document.querySelector('.logo-img').src = siteConfig.logoUrl;
        document.getElementById('searchInput').placeholder = siteConfig.searchPlaceholder;
        renderAbout(siteConfig.about);
        renderContact(siteConfig.contact, siteConfig.contactEmail);
        const response = await fetch(siteConfig.galleriesUrl);
        if (!response.ok) throw new Error(`Could not load galleries from ${siteConfig.galleriesUrl}`);
        const galleries = await response.json();
        galleries.forEach(gallery => {
          const card = document.createElement('a');
          card.className = 'gallery-card';
          card.href = makeViewerUrl('gallery.html', { search: gallery.searchCriteria || '' });
          const wrapper = document.createElement('div');
          wrapper.className = 'card-img-wrapper';
          const image = document.createElement('img');
          image.className = 'card-img';
          image.alt = gallery.title || '';
          image.src = new URL(gallery.coverUrl || '', siteConfig.galleriesUrl).href;
          const info = document.createElement('div');
          info.className = 'card-info';
          const title = document.createElement('h3');
          title.textContent = gallery.title || '';
          wrapper.appendChild(image); info.appendChild(title); card.append(wrapper, info); grid.appendChild(card);
        });
      } catch (error) {
        console.error('Error loading configuration or galleries:', error);
        grid.textContent = `Unable to load galleries: ${error.message}`;
      }
    }
    function showSection(id) {
      document.querySelectorAll('.content-section').forEach(section => section.classList.toggle('active', section.id === id));
      if (id === 'home-section') scrollTo({ top:0, behavior:'smooth' });
    }
    function scrollToSearch() {
      showSection('home-section');
      setTimeout(() => { document.getElementById('searchContainer').scrollIntoView({ behavior:'smooth' }); document.getElementById('searchInput').focus(); }, 100);
    }
    function handleSearch(event) {
      event.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      if (query && siteConfig) location.href = makeViewerUrl('gallery.html', { search:query });
    }
    window.addEventListener('load', () => {
      if (new URLSearchParams(location.search).has('config')) loadHub();
      else showReadme();
    });
  </script>
</body>
</html>
